name: TortoiseSCM Windows

on:
  push:
    paths:
      - 'src/TortoiseSCM/**'
      - 'src/TortoiseSCM.sln'
      - 'src/TortoiseShell/Plastic*'
      - 'src/TortoiseShell/TortoiseSCMShell.vcxproj'
      - 'test/TortoiseSCM/**'
      - 'contrib/tortoisescm/**'
      - 'build-tortoisescm.ps1'
      - 'doc/TortoiseSCM.md'
      - '.github/workflows/tortoisescm.yml'
  pull_request:
    paths:
      - 'src/TortoiseSCM/**'
      - 'src/TortoiseSCM.sln'
      - 'src/TortoiseShell/Plastic*'
      - 'src/TortoiseShell/TortoiseSCMShell.vcxproj'
      - 'test/TortoiseSCM/**'
      - 'contrib/tortoisescm/**'
      - 'build-tortoisescm.ps1'
      - 'doc/TortoiseSCM.md'
      - '.github/workflows/tortoisescm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and run local tests
        run: .\build-tortoisescm.ps1 -Configuration Release -Test
      - name: Verify portable package and isolated installation
        run: .\test\TortoiseSCM\PackageTests.ps1
      - name: Create portable package
        run: .\contrib\tortoisescm\Package.ps1 -Version "0.1.0-ci-$env:GITHUB_RUN_NUMBER"
      - name: Upload portable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: TortoiseSCM-windows-x64
          path: |
            bin/TortoiseSCM/packages/*.zip
            bin/TortoiseSCM/packages/*.sha256
          if-no-files-found: error
          retention-days: 14
